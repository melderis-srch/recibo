<!-- Estilos.html — incluido desde Index.html con <?!= include('Estilos'); ?> -->
<style>
  :root {
    --azul: #1f4e79;
    --azul-claro: #2e6ca4;
    --gris: #5a5a5a;
    --gris-claro: #eef2f6;
    --borde: #d6dee6;
    --rojo: #b3261e;
    --verde: #1e7d4f;
    --ambar: #8a6d00;
    --ambar-bg: #fff6d6;
    --radio: 8px;
    --sombra: 0 1px 3px rgba(0, 0, 0, .12), 0 1px 2px rgba(0, 0, 0, .08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1c2733;
    background: #f4f6f9;
    line-height: 1.45;
  }

  .app-header {
    background: var(--azul);
    color: #fff;
    padding: 14px 20px;
    box-shadow: var(--sombra);
  }
  .app-header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .app-header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }

  .layout {
    display: grid;
    grid-template-columns: minmax(360px, 460px) 1fr;
    gap: 20px;
    padding: 20px;
    align-items: start;
    max-width: 1280px;
    margin: 0 auto;
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 18px;
  }
  .panel h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--azul);
    margin: 0 0 12px;
    border-bottom: 2px solid var(--gris-claro);
    padding-bottom: 6px;
  }
  .panel h2:not(:first-of-type) { margin-top: 22px; }

  /* ---- Formulario ---- */
  .campo { margin-bottom: 12px; }
  .campo label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--gris);
    margin-bottom: 4px;
  }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid var(--borde);
    border-radius: 6px;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--azul-claro);
    box-shadow: 0 0 0 3px rgba(46, 108, 164, .15);
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  .buscador { display: flex; gap: 8px; align-items: flex-end; }
  .buscador .campo { flex: 1; margin-bottom: 0; }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primario { background: var(--azul); color: #fff; }
  .btn-primario:hover:not(:disabled) { background: #163a5a; }
  .btn-secundario { background: var(--gris-claro); color: var(--azul); }
  .btn-secundario:hover:not(:disabled) { background: #dde6ee; }
  .btn-pequeno { padding: 6px 10px; font-size: 12px; }
  .btn-link {
    background: none; color: var(--azul-claro); padding: 4px 6px;
    text-decoration: underline; font-weight: 600;
  }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* ---- Forma de pago (filas dinámicas) ---- */
  .fp-fila {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr 1fr auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .fp-fila input { font-size: 13px; padding: 6px 8px; }
  .fp-quitar {
    background: #fbeaea; color: var(--rojo);
    border-radius: 6px; padding: 6px 10px; line-height: 1;
  }
  .fp-quitar:hover { background: #f6d5d5; }
  .fp-encabezado {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr 1fr auto;
    gap: 8px;
    font-size: 11px; font-weight: 700; color: var(--gris);
    text-transform: uppercase; letter-spacing: .03em;
    margin-bottom: 4px;
  }
  @media (max-width: 640px) {
    .fp-fila, .fp-encabezado { grid-template-columns: 1fr; }
    .fp-encabezado { display: none; }
  }

  /* ---- Mensajes / estados ---- */
  .msg { padding: 10px 12px; border-radius: 6px; font-size: 13px; margin: 10px 0; display: none; }
  .msg.show { display: block; }
  .msg-error { background: #fbeaea; color: var(--rojo); border: 1px solid #f0c4c1; }
  .msg-ok { background: #e6f4ec; color: var(--verde); border: 1px solid #bfe3cd; }
  .msg-aviso { background: var(--ambar-bg); color: var(--ambar); border: 1px solid #ecd98a; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, .4); border-top-color: #fff;
    border-radius: 50%; animation: girar .7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  .spinner-azul { border-color: rgba(31, 78, 121, .25); border-top-color: var(--azul); }
  @keyframes girar { to { transform: rotate(360deg); } }

  .totales-resumen {
    margin-top: 14px; padding: 12px; background: var(--gris-claro);
    border-radius: 6px; font-size: 14px;
  }
  .totales-resumen .linea { display: flex; justify-content: space-between; padding: 2px 0; }
  .totales-resumen .total { font-weight: 700; font-size: 16px; color: var(--azul); border-top: 1px solid var(--borde); margin-top: 6px; padding-top: 6px; }
  .son-letras { font-style: italic; font-size: 13px; color: var(--gris); margin-top: 6px; }

  /* ============================================================
     EL RECIBO (lo que se exporta a PDF) — formato A4
     ============================================================ */
  .recibo-wrap { overflow: auto; }

  #recibo {
    width: 210mm;
    min-height: 297mm;
    padding: 16mm 16mm 14mm;
    margin: 0 auto;
    background: #fff;
    color: #1c2733;
    font-size: 12px;
    box-shadow: var(--sombra);
  }
  @media (max-width: 980px) {
    #recibo { width: 100%; min-height: auto; padding: 10mm; }
  }

  .rec-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 2px solid var(--azul); padding-bottom: 10px; margin-bottom: 14px;
    gap: 16px;
  }
  .rec-logo { max-height: 90px; max-width: 230px; object-fit: contain; }
  .rec-logo-placeholder {
    width: 200px; height: 80px; border: 1px dashed var(--borde);
    display: flex; align-items: center; justify-content: center;
    color: #aab4bf; font-size: 11px; text-align: center;
  }
  .rec-empresa { text-align: right; font-size: 11px; line-height: 1.5; }
  .rec-empresa .razon { font-size: 15px; font-weight: 700; color: var(--azul); }

  .rec-titulo {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 6px 0 14px;
  }
  .rec-titulo .t { font-size: 22px; font-weight: 700; letter-spacing: .08em; color: var(--azul); }
  .rec-titulo .n { font-size: 16px; font-weight: 700; }

  .rec-bloque { margin-bottom: 12px; }
  .rec-bloque .tit {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .03em; color: var(--azul); background: var(--gris-claro);
    padding: 4px 8px; border-radius: 4px; margin-bottom: 6px;
  }
  .rec-campos { display: grid; gap: 4px 18px; padding: 0 4px; }
  .rec-campos.c3 { grid-template-columns: repeat(3, 1fr); }
  .rec-campos.c4 { grid-template-columns: repeat(4, 1fr); }
  .rec-campos .item { font-size: 12px; }
  .rec-campos .item .k { font-weight: 700; color: var(--gris); }

  table.rec-tabla { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.rec-tabla th, table.rec-tabla td {
    border: 1px solid var(--borde); padding: 5px 8px; text-align: left;
  }
  table.rec-tabla th { background: var(--gris-claro); color: var(--azul); font-size: 11px; text-transform: uppercase; }
  table.rec-tabla td.num, table.rec-tabla th.num { text-align: right; }

  .rec-total {
    margin-top: 14px; display: flex; justify-content: flex-end;
  }
  .rec-total .caja {
    min-width: 280px; border: 1px solid var(--borde); border-radius: 6px; overflow: hidden;
  }
  .rec-total .fila { display: flex; justify-content: space-between; padding: 5px 12px; font-size: 12px; }
  .rec-total .fila.total { background: var(--azul); color: #fff; font-weight: 700; font-size: 14px; }

  .rec-son {
    margin-top: 10px; font-size: 12px; padding: 8px 10px;
    background: var(--gris-claro); border-radius: 4px;
  }
  .rec-son .k { font-weight: 700; color: var(--azul); }

  .rec-firma {
    margin-top: 36px; display: flex; justify-content: flex-end; text-align: center;
  }
  .rec-firma .box { width: 240px; }
  .rec-firma img { max-height: 80px; max-width: 220px; object-fit: contain; }
  .rec-firma .linea { border-top: 1px solid #1c2733; margin-top: 4px; padding-top: 4px; font-size: 11px; }

  .oculto { display: none !important; }
</style>
